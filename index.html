<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🏰 SiegeGuard — 3D 塔防</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;cursor:default}canvas{display:block}#ui-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}#ui-layer>*{pointer-events:auto}#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:24px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 24px;color:#fff;font-size:15px;z-index:20}#hud span{display:flex;align-items:center;gap:6px}#tower-panel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 16px;z-index:20}#tower-panel button{width:80px;height:90px;border:2px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .2s}#tower-panel button:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);transform:translateY(-2px)}#tower-panel button.selected{border-color:#ffd700;background:rgba(255,215,0,.15);box-shadow:0 0 12px rgba(255,215,0,.3)}#tower-panel button:disabled{opacity:.35;cursor:not-allowed;transform:none}#tower-panel button:disabled:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}#tower-panel .tower-icon{font-size:28px}#tower-panel .tower-cost{color:#ffd700;font-size:11px}#tower-panel .tower-name{font-size:11px;opacity:.8}#wave-btn{position:fixed;bottom:140px;right:20px;padding:12px 28px;background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;z-index:20;letter-spacing:2px;transition:all .2s;box-shadow:0 4px 15px rgba(233,69,96,.4)}#wave-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(233,69,96,.6)}#wave-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}#wave-btn.wave-active{background:linear-gradient(135deg,#555,#444);box-shadow:none}#speed-btn{position:fixed;top:16px;right:20px;padding:8px 18px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:20;transition:all .2s}#speed-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}#speed-btn.speed2{background:rgba(255,152,0,.3);border-color:#ff9800;color:#ff9800}#speed-btn.speed3{background:rgba(244,67,54,.4);border-color:#f44336;color:#f44336}#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:28px;font-weight:700;z-index:30;pointer-events:none;text-shadow:0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .3s}#message.show{opacity:1}#sell-hint{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;z-index:15;pointer-events:none}#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:11px;pointer-events:none;z-index:20}</style></head><body><div id="hud"><span>❤️ <b id="lives-display">20</b></span><span>💰 <b id="gold-display">400</b></span><span>🌊 <b id="wave-display">0</b></span><span>⭐ <b id="score-display">0</b></span></div><div id="tower-panel"><button data-tower="arrow" title="箭塔 — 快速单目标攻击"><span class="tower-icon">🏹</span><span class="tower-name">箭塔</span><span class="tower-cost">💰60</span></button><button data-tower="cannon" title="炮塔 — 范围爆炸伤害"><span class="tower-icon">💣</span><span class="tower-name">炮塔</span><span class="tower-cost">💰120</span></button><button data-tower="ice" title="冰塔 — 减速敌人"><span class="tower-icon">❄️</span><span class="tower-name">冰塔</span><span class="tower-cost">💰90</span></button><button data-tower="lightning" title="电塔 — 连锁闪电"><span class="tower-icon">⚡</span><span class="tower-name">电塔</span><span class="tower-cost">💰160</span></button></div><button id="wave-btn">⚔️ 开始波次</button><button id="speed-btn">⏩ 1x</button><div id="message"></div><div id="sell-hint">🖱 右键已放置的塔可出售 (返还50%)</div><div id="hint">🖱 点击面板选塔→左键放塔 | 右键出售 | 左键拖拽旋转 | 滚轮缩放 | F键倍速 | 空格开波</div><script type="module" src="/src/main.ts"></script></body></html>
